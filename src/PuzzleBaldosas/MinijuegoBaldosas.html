<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ejemplo A-Frame</title>
    <!-- 1. Incluir la librería de A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Sistema de físicas -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

    <!-- Eliminamos aframe-extras y physics-extras porque bloqueaban el movimiento -->
    <!-- Usaremos la cámara estándar con gravedad personalizada -->

    <!-- Lógica del juego externa -->
    <script src="MinijuegoBaldosas.js"></script>
    
    <style>
      /* Animación para simular que el personaje habla/se mueve */
      @keyframes hablar {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
    <style>
      #btn-hub{position:fixed;top:14px;left:14px;z-index:999;padding:8px 18px;background:rgba(15,10,25,.85);border:1px solid rgba(201,168,76,.4);border-radius:10px;color:#f0e6d3;font-family:Georgia,serif;font-size:.85rem;cursor:pointer;backdrop-filter:blur(6px);letter-spacing:1px;transition:background .3s,border-color .3s,transform .2s}#btn-hub:hover{background:rgba(30,20,50,.95);border-color:#c9a84c;transform:scale(1.05)}
    </style>
  </head>
  <body>
    <button id="btn-hub" onclick="window.location.href='../index.html'">← Menú</button>
    <!-- Overlay 2D (HUD) fijo en la pantalla -->
    <div id="hud-info" style="
      position: fixed; 
      top: 20px; 
      left: 20px; 
      z-index: 9999; 
      background-color: rgba(0, 0, 0, 0.7); 
      color: white; 
      padding: 15px; 
      font-family: sans-serif; 
      font-size: 24px; 
      border-radius: 10px;
      border: 2px solid #fff;">
      Camina sobre las baldosas...
    </div>

    <!-- Nuevo Overlay con Imagen y Texto (Centro Arriba - Estilo Persona Hablando) -->
    <div id="hud-level" style="
      position: fixed; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%);
      z-index: 9999; 
      display: flex; 
      align-items: flex-start;">
      <!-- Usamos una de las imágenes existentes como icono -->
      <img id="hud-img" src="Pngs/reinaminiatura.png" style="
        width: 300px; 
        height: 300px; 
        object-fit: contain;
        animation: hablar 1s infinite ease-in-out;">
      
      <!-- Bocadillo de texto -->
      <div style="
        position: relative;
        margin-left: 20px; 
        margin-top: 20px; 
        background-color: white; 
        color: black; 
        padding: 15px 25px; 
        border-radius: 20px;
        border: 3px solid black;
        font-family: sans-serif; 
        font-size: 35px; 
        font-weight: bold;">
        <span id="row-display">Inicio</span>
        
        <!-- Triángulo del bocadillo (apuntando a la imagen) -->
        <div style="
          position: absolute;
          left: -10px;
          bottom: 15px;
          width: 0; 
          height: 0; 
          border-top: 10px solid transparent;
          border-bottom: 10px solid transparent; 
          border-right: 10px solid white;">
        </div>
      </div>
    </div>

    <!-- Nuevo Overlay para la Chuleta (Derecha) -->
    <!-- Lo bajamos a top: 100px para que no tape el nuevo HUD de imagen -->
    <div id="hud-cheat" style="
      position: fixed; 
      top: 100px; 
      right: 20px; 
      z-index: 9999; 
      background-color: rgba(0, 0, 0, 0.7); 
      color: #FFFF00; 
      padding: 15px; 
      font-family: monospace; 
      font-size: 16px; 
      border-radius: 10px;
      border: 2px solid #FFFF00;
      max-width: 250px;">
      Generando ruta segura...
    </div>

    <!-- 2. Definir la escena -->
    <a-scene physics="debug: false; gravity: -9.8">
      <!-- Suelo lejano (negro azulado) para dar sensación de altura -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#263066" static-body></a-plane>

      <!-- Plataforma de inicio. Añadimos clase 'suelo' para que la gravedad la detecte -->
      <!-- Hacemos el suelo más grueso (1m) y ajustamos Y para que la superficie siga en 12 -->
      <a-box class="suelo" position="0 11.5 5.4" width="30" height="1" depth="6" color="#555" static-body></a-box>

      <!-- VOLVEMOS A LA CÁMARA ESTÁNDAR (que sí se mueve) + Gravedad Custom -->
      <a-camera position="0 13.6 4.5" look-controls="pointerLockEnabled: true" wasd-controls="acceleration: 60" gravedad-camara seguridad-plataforma>
      </a-camera>
      
      <!-- Contenedor de baldosas a 2m de altura (Y=2) -->
      <a-entity id="grid-container" position="0 12 0"></a-entity>
      
      <!-- Un cielo gris claro para el fondo -->
      <a-sky color="#ECECEC"></a-sky>

    </a-scene>

  </body>
</html>
