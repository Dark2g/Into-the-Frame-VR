<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Puzzle Puerta</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/bosque_setas.js"></script>
</head>

<body>
<a-scene cursor="rayOrigin: mouse">

  <a-entity position="0 1.6 4">
    <a-camera></a-camera>
  </a-entity>

  <a-light type="ambient" intensity="0.6"></a-light>
  <a-light type="directional" position="1 3 2"></a-light>

  <a-plane rotation="-90 0 0"
           width="10" height="10"
           color="#8AC">
  </a-plane>

  <a-box id="door"
         position="0 1 0"
         width="1.5"
         height="2"
         depth="0.2"
         color="#444">
  </a-box>

  <a-box color="red"
         position="-1.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:0"></a-box>

  <a-box color="blue"
         position="-0.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:1"></a-box>

  <a-box color="green"
         position="0.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:2"></a-box>

  <a-box color="yellow"
         position="1.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:3"></a-box>

  <a-entity puzzle_patron-manager></a-entity>

</a-scene>
</body>
</html>
