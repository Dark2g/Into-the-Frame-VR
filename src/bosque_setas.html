<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>bosque de setas</title>
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="js/bosque_setas.js"></script>
  <style>
    #btn-hub{position:fixed;top:14px;left:14px;z-index:999;padding:8px 18px;background:rgba(15,10,25,.85);border:1px solid rgba(201,168,76,.4);border-radius:10px;color:#f0e6d3;font-family:Georgia,serif;font-size:.85rem;cursor:pointer;backdrop-filter:blur(6px);letter-spacing:1px;transition:background .3s,border-color .3s,transform .2s}#btn-hub:hover{background:rgba(30,20,50,.95);border-color:#c9a84c;transform:scale(1.05)}
  </style>
</head>

<body>
<button id="btn-hub" onclick="window.location.href='index.html'">← Menú</button>
<a-scene cursor="rayOrigin: mouse" physics="driver: ammo; gravity: 0 -9.8 0; debug: true">

  <a-entity position="0 1.6 4">
    <a-cylinder id="player" radius="0.3" height="1.6" 
                ammo-body="type: dynamic; mass: 5; linearDamping: 0.9; angularFactor: 0 0 0"
                ammo-shape="type: cylinder"
                visible="false"
                player-move>
        
        <a-camera id="cam" position="0 0.6 0" wasd-controls="enabled: false"></a-camera>

    </a-cylinder>
  </a-entity>

  <a-light type="ambient" intensity="0.6"></a-light>
  <a-light type="directional" position="1 3 2"></a-light>

  <a-entity id="map"
            gltf-model="url(../assets/models/Mario/gbl/Claro_de_Setas.glb)"
            position="0 -7.5 0"
            scale="0.5 0.5 0.5"
            shadow="receive: true"
            colision-ammo>
  </a-entity>

  <!-- <a-plane rotation="-90 0 0"
           width="40" height="40"
           color="#8AC"
           ammo-body="type: static"
           ammo-shape="type: box">
  </a-plane> -->

  <a-box id="door"
         position="0 1 0"
         width="1.5"
         height="2"
         depth="0.2"
         color="#444">
  </a-box>

  <a-box color="red"
         position="-1.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:0"></a-box>

  <a-box color="blue"
         position="-0.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:1"></a-box>

  <a-box color="green"
         position="0.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:2"></a-box>

  <a-box color="yellow"
         position="1.5 1 1"
         width="0.4" height="0.4" depth="0.2"
         puzzle_patron-button="id:3"></a-box>

  <a-entity puzzle_patron-manager></a-entity>

  <!-- <a-box class="mushroom" data-mushroom-type="normal" position="-8 0.5 -5" width="0.5" height="1" depth="0.5" color="#FF6B6B"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="6 0.5 -8" width="0.5" height="1" depth="0.5" color="#4ECDC4"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="-3 0.5 -12" width="0.5" height="1" depth="0.5" color="#FFE66D"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="10 0.5 -2" width="0.5" height="1" depth="0.5" color="#FF6B6B"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="-12 0.5 -10" width="0.5" height="1" depth="0.5" color="#4ECDC4"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="3 0.5 2" width="0.5" height="1" depth="0.5" color="#FFE66D"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="-5 0.5 5" width="0.5" height="1" depth="0.5" color="#FF6B6B"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="8 0.5 -14" width="0.5" height="1" depth="0.5" color="#4ECDC4"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="-10 0.5 3" width="0.5" height="1" depth="0.5" color="#FFE66D"></a-box>
  <a-box class="mushroom" data-mushroom-type="normal" position="12 0.5 6" width="0.5" height="1" depth="0.5" color="#FF6B6B"></a-box> -->

  <a-entity class="mushroom special"
            data-mushroom-type="special"
            position="0 -0.5 -6"
            gltf-model="url(../assets/models/Mario/gbl/Colmenilla.glb)"
            animation__rotate="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear"></a-entity>
<a-entity id="door2" position="5 0 0">
  
  <a-box width="1.5"
         height="2"
         depth="0.2"
         position="0 1 0"
         color="#555">
  </a-box>

  <a-sphere color="gold"
            radius="0.15"
            position="0 1 0.15"
            candado="llave: llave_roja">
  </a-sphere>

</a-entity>
<a-box id="key_red"
       position="2 0.5 -3"
       width="0.3" height="0.3" depth="0.1"
       color="gold"
       llave="id: llave_roja">
</a-box>

</a-scene>
</body>
</html>
