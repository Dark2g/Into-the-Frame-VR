<html lang="es">

<head>
       <meta charset="utf-8">
       <title>Bosque de Setas</title>
       <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
       <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
       <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>
       <script
              src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
       <script src="js/bosque_setas.js"></script>
       <script src="js/door_funtions.js"></script>
       <script src="js/movement.js"></script>
       <link rel="stylesheet" href="css/door-funtions.css">
       <style>
              #btn-hub {
                     position: fixed;
                     top: 14px;
                     left: 14px;
                     z-index: 999;
                     padding: 8px 18px;
                     background: rgba(15, 10, 25, .85);
                     border: 1px solid rgba(201, 168, 76, .4);
                     border-radius: 10px;
                     color: #f0e6d3;
                     cursor: pointer;
              }
       </style>
</head>

<body>
       <div id="hud-title">
              <h1></h1>
              <p></p>
       </div>
      
       <div id="hud-door"></div>
       <div id="loading-screen">
              <h2>Entrando...</h2>
              <div class="spinner"></div>
       </div>
       <button id="btn-hub" onclick="window.location.href='index.html'">← Menú</button>
       <a-scene  cursor="rayOrigin: mouse" physics="driver: ammo; gravity: 0 -9.8 0; debug:false">
              <!-- ASSETS -->
              <a-assets>
                     <a-asset-item id="mapModel" src="../assets/models/Mario/gbl/Claro_de_Setas.glb"></a-asset-item>
                     <a-asset-item id="mushroomModel" src="../assets/models/Mario/gbl/Colmenilla.glb"></a-asset-item>
                     <a-asset-item id="LockModel" src="../assets/models/Mario/gbl/Candado.glb"></a-asset-item>
                     <a-asset-item id="mushroomKeyModel" src="../assets/models/Mario/gbl/Llave.glb"></a-asset-item>
                     <a-asset-item id="RightDoorModel" src="../assets/models/Mario/gbl/Puerta_Drch.glb"></a-asset-item>
                     <a-asset-item id="LeftDoorModel" src="../assets/models/Mario/gbl/Puerta_Izq.glb"></a-asset-item>
                     <a-asset-item id="RedMushroomModel"
                            src="../assets/models/Mario/gbl/Seta_Roja_Patron.glb"></a-asset-item>
                     <a-asset-item id="BlueMushroomModel"
                            src="../assets/models/Mario/gbl/Seta_Azul_Patron.glb"></a-asset-item>
                     <a-asset-item id="YellowMushroomModel"
                            src="../assets/models/Mario/gbl/Seta_Amarilla_Patron.glb"></a-asset-item>
                     <a-asset-item id="GreenMushroomModel"
                            src="../assets/models/Mario/gbl/Seta_Verde_Patron.glb"></a-asset-item>
                     <audio id="llave-snd" src="../assets/sounds/Llave.wav" preload="auto"></audio>
                     <audio id="puerta-snd" src="../assets/sounds/Puerta.wav" preload="auto"></audio>

              </a-assets>
              <!-- PLAYER -->
              <a-entity position="0 1.6 0">
                     <a-cylinder id="player" radius="0.3" height="1.6" rotation="0 180 0" position="0 5 -60"
                            ammo-body="type: dynamic; mass:5; linearDamping:0.9; angularFactor:0 0 0"
                            ammo-shape="type: cylinder" visible="false" player-move door-detector>
                            <a-entity id="cam" camera look-controls="pointerLockEnabled:false" position="0 0.8 0">
                            </a-entity>
                     </a-cylinder>
              </a-entity>
              <!-- LUCES -->
              <a-light type="ambient" intensity="0.6"></a-light>
              <a-light type="directional" position="1 3 2"></a-light>
              <!-- MAPA -->
              <a-entity id="map" gltf-model="#mapModel" position="0 -7.5 0" scale="0.5 0.5 0.5" colision-ammo>
              </a-entity>
              <!-- PUERTA PUZZLE -->
              <a-entity id="door" position="0 2.4 -37">
                     <!-- pivote izquierda -->
                     <a-entity id="door-left-pivot"  sound="src: #puerta-snd; loop: false; volume: 1;" position="2.5 0 0"> <a-entity id="door-left"
                                   gltf-model="#LeftDoorModel" position="-0.5 0 0" rotation="0 180 0"
                                   scale="2.75 2.75 1" ammo-body="type: kinematic" colision-ammo>
                            </a-entity>
                     </a-entity>
                     <!-- pivote derecha -->
                     <a-entity id="door-right-pivot"  sound="src: #puerta-snd; loop: false; volume: 1;" position="-1.56 0 -0.05"> <a-entity id="door-right"
                                   gltf-model="#RightDoorModel" position="2 0 0" rotation="0 180 0" scale="2.75 2.75 1"
                                   ammo-body="type: kinematic" colision-ammo> </a-entity>
                     </a-entity>
              </a-entity>
              <!-- BOTONES PUZZLE -->
              <a-box color="red" position="4.1 3.5 -37.43" width="0.4" height="0.4" depth="0.2"
                     puzzle_patron-button="id:0"></a-box>
              <a-box color="blue" position="3.6 3.5 -37.43" width="0.4" height="0.4" depth="0.2"
                     puzzle_patron-button="id:1"></a-box>
              <a-box color="#00e727" position="4.1 4 -37.43" width="0.4" height="0.4" depth="0.2"
                     puzzle_patron-button="id:2"></a-box>
              <a-box color="yellow" position="3.6 4 -37.43" width="0.4" height="0.4" depth="0.2"
                     puzzle_patron-button="id:3"></a-box>
              <a-entity puzzle_patron-manager></a-entity>
              <!-- SETAS PATRON -->
              <a-entity gltf-model="#YellowMushroomModel" position="12.811 1.997 -50.37" scale="0.5 0.5 0.5"
                     rotation="0 -45 0"></a-entity>
              <a-entity gltf-model="#YellowMushroomModel" position="12.811 2.086 -50.509" scale="0.5 0.5 0.5"
                     rotation="0 180 0"></a-entity>
              <a-entity gltf-model="#YellowMushroomModel" position="12.811 2.2 -50.509" scale="0.5 0.5 0.5"
                     rotation="0 -90 0"></a-entity>
              <a-entity gltf-model="#YellowMushroomModel" position="12.811 1.931 -50.509" scale="0.5 0.5 0.5"
                     rotation="0 -90 0"></a-entity>
              <a-entity gltf-model="#RedMushroomModel" position="-5.964 2.2 -52.463" scale="0.5 0.5 0.5"
                     rotation="0 70 0"></a-entity>
              <a-entity gltf-model="#RedMushroomModel" position="-5.984 1.966 -52.439" scale="0.5 0.5 0.5"></a-entity>
              <a-entity gltf-model="#RedMushroomModel" position="-5.984 2.035 -52.554" scale="0.5 0.5 0.5"
                     rotation="0 120 0"></a-entity>
              <a-entity gltf-model="#BlueMushroomModel" position="-10.681 1.799 -67.487" scale="0.5 0.5 0.5"
                     rotation="0 90 0"></a-entity>
              <a-entity gltf-model="#BlueMushroomModel" position="-10.681 1.949 -67.487" scale="0.5 0.5 0.5"></a-entity>
              <a-entity gltf-model="#GreenMushroomModel" position="-17.131 1.727 -44.915"
                     scale="0.5 0.5 0.5"></a-entity>
              <!-- SETA -->
              <a-entity class="mushroom" data-mushroom-type="special" position="3 -0.760 -8">

                     <!-- modelo desplazado para corregir pivot -->
                     <a-entity gltf-model="#mushroomModel" position="2.517 -4.564 11.264" scale="0.35 0.35 0.35">
                     </a-entity>

              </a-entity>

              <a-entity class="mushroom" data-mushroom-type="special" position="0 -0.760 -6">

                     <!-- modelo desplazado para corregir pivot -->
                     <a-entity gltf-model="#mushroomModel" position="2.517 -4.564 11.264" scale="0.35 0.35 0.35">
                     </a-entity>

              </a-entity>
              <a-entity class="mushroom" data-mushroom-type="special" position="-4 -0.760 -10">

                     <!-- modelo desplazado para corregir pivot -->
                     <a-entity gltf-model="#mushroomModel" position="2.517 -4.564 11.264" scale="0.35 0.35 0.35">
                     </a-entity>

              </a-entity>

              <!-- PUERTA CON CANDADO -->
              <a-entity id="door2" position="-1.5 -0.7 2.8">
                     <!-- pivote izquierda -->
                     <a-entity id="door2-left-pivot" sound="src: #puerta-snd; loop: false; volume: 1;" position="4.530 0 0">
                            <a-entity id="door2-left" gltf-model="#LeftDoorModel" position="-1.5 0 0" rotation="0 180 0"
                                   scale="4.8 2.85 1" ammo-body="type: kinematic" colision-ammo>
                            </a-entity>
                     </a-entity>
                     <!-- pivote derecha -->
                     <a-entity id="door2-right-pivot"  sound="src: #puerta-snd; loop: false; volume: 1;" position="-3.38 0 -0.05">
                            <a-entity id="door2-right" gltf-model="#RightDoorModel" position="3.64 0 0"
                                   rotation="0 180 0" scale="4.8 2.85 1" ammo-body="type: kinematic" colision-ammo>
                            </a-entity>
                     </a-entity>
                     <a-entity  gltf-model="#LockModel" position="0.380 1.195 -0.170" scale="0.4 0.4 0.4"
                            rotation="0 180 0" candado="llave: llave_roja"
                            > </a-entity>
              </a-entity>
              <!-- LLAVE -->
              <a-box id="key_red" position="13.67 -0.59 1.308" width="0.3" height="0.3" rotation="13.75 16 -90"
                     scale="0.25 0.25 0.25" depth="0.1" color="red" gltf-model="#mushroomKeyModel"
                     llave="id: llave_roja" sound="src: #llave-snd; loop: false; volume: 1;">
              </a-box>
              <a-entity id="door-lobby" position="-0.6 -0.9 5" scale="3 1 1" door-portal="scene: index.html; label:"
                     rotation="0 180 0">
                     <!-- Marco -->
                     <a-box width="0.3" height="4" depth="0.3" position="-1.5 2 0" color="#2E7D32"
                            material="emissive: #1B5E20; emissiveIntensity: 0.3"></a-box>
                     <a-box width="0.3" height="4" depth="0.3" position="1.5 2 0" color="#2E7D32"
                            material="emissive: #1B5E20; emissiveIntensity: 0.3"></a-box>
                     <a-box width="3.3" height="0.3" depth="0.3" position="0 4 0" color="#388E3C"
                            material="emissive: #2E7D32; emissiveIntensity: 0.4"></a-box>
                     <!-- Portal interior (plano brillante) -->
                     <a-plane width="2.7" height="3.85" position="0 2.05 0" color="#4CAF50"
                            material="emissive: #4CAF50; emissiveIntensity: 0.4; opacity: 0.3; transparent: true; side: double"
                            animation="property: material.emissiveIntensity; from: 0.2; to: 0.6; dur: 2000; dir: alternate; loop: true">
                     </a-plane>
                     <!-- Cartel -->
                     <a-plane width="2.4" height="0.5" position="0 4.6 0" color="#1B5E20"
                            material="emissive: #1B5E20; emissiveIntensity: 0.2">
                            <a-text value="Volver al lobby" align="center" color="#A5D6A7" width="4"
                                   position="0 0 0.01"></a-text>
                     </a-plane>
                     <!-- Icono -->
                     <a-text value="*" align="center" color="#81C784" width="8" position="0 2.8 0.05" font="mozillavr"
                            opacity="0.7"></a-text>
                     <!-- Zona de paso (invisible, para detección) -->
                     <a-box class="door-trigger" width="2.7" height="3.85" depth="1.2" position="0 2 0"
                            visible="false"></a-box>
              </a-entity>
              <!-- TRIGGER DEL RETO -->
              <a-entity
                     timer-trigger="minX:-16.6; maxX:15.85; minZ:-28.75; maxZ:3.05; hito:reto_setas_completado"></a-entity>
       </a-scene>
</body>

</html>
