<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ajedrez A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse">
	  <a-entity position="0 1.6 4">
		<a-camera></a-camera>
	  </a-entity>
	  
      <a-entity camera position="0 8 10" rotation="-45 0 0"></a-entity>
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="0 10 5"></a-entity>

      <!-- Tablero -->
      <a-entity id="board"></a-entity>

      <!-- Piezas -->
      <a-entity id="pieces"></a-entity>
	  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>

	  <script src="js/chess.js"></script>
    </a-scene>
  </body>
</html>
