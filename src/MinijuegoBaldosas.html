<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ejemplo A-Frame - Camino de Símbolos</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

    <script src="js/MinijuegoBaldosas.js"></script>
    
    <style>
      /* Animación para simular que el personaje habla/se mueve */
      @keyframes hablar {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
    <style>
      #btn-hub{position:fixed;top:14px;left:14px;z-index:999;padding:8px 18px;background:rgba(15,10,25,.85);border:1px solid rgba(201,168,76,.4);border-radius:10px;color:#f0e6d3;font-family:Georgia,serif;font-size:.85rem;cursor:pointer;backdrop-filter:blur(6px);letter-spacing:1px;transition:background .3s,border-color .3s,transform .2s}#btn-hub:hover{background:rgba(30,20,50,.95);border-color:#c9a84c;transform:scale(1.05)}
    </style>
  </head>
  <body>
    <button id="btn-hub" onclick="window.location.href='index.html'">← Menú</button>

    <div id="hud-level" style="
      position: fixed; 
      top: 3vh; 
      left: 50%; 
      transform: translateX(-50%);
      z-index: 9999; 
      display: flex; 
      align-items: flex-start;
      width: 90vw;
      max-width: 1200px;
      justify-content: center;
      pointer-events: none;">
      <img id="hud-img" src="../assets/2D/reinaminiatura.png" style="
        width: clamp(120px, 15vw, 300px); 
        height: clamp(120px, 15vw, 300px); 
        object-fit: contain;
        flex-shrink: 0;
        animation: hablar 1s infinite ease-in-out;">
      
      <div style="
        position: relative;
        margin-left: clamp(10px, 2vw, 20px); 
        margin-top: clamp(10px, 2vw, 20px); 
        background-color: white; 
        color: black; 
        padding: clamp(12px, 1.5vw, 25px) clamp(15px, 2vw, 30px); 
        border-radius: 20px;
        border: clamp(2px, 0.3vw, 4px) solid black;
        font-family: sans-serif; 
        font-size: clamp(16px, 1.8vw, 35px); 
        font-weight: bold;
        max-width: 60vw;
        pointer-events: auto;">
        <span id="row-display">Inicio</span>
        
        <div style="
          position: absolute;
          left: -10px;
          top: clamp(15px, 2.5vw, 30px);
          width: 0; 
          height: 0; 
          border-top: 10px solid transparent;
          border-bottom: 10px solid transparent; 
          border-right: 10px solid white;">
        </div>
      </div>
    </div>
    <a-scene physics="debug: false; gravity: -9.8">
      <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#263066" static-body></a-plane>

      <a-box class="suelo" position="0 11.5 5.4" width="28" height="1" depth="6" color="#555" static-body></a-box>
      
      <a-box class="suelo-final" position="0 11.5 -84" width="28" height="1" depth="6" color="#555" static-body></a-box>

      <a-camera position="0 15.0 4.5" look-controls="pointerLockEnabled: true" wasd-controls="acceleration: 60" gravedad-camara seguridad-plataforma>
      </a-camera>
      
      <a-entity id="grid-container" position="0 12 0"></a-entity>
      
      <a-sky color="#ECECEC"></a-sky>

    </a-scene>

  </body>
</html>
