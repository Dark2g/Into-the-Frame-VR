<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Ejemplo A-Frame - Camino de Símbolos</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- BALDOSAS --> 
  <script src="js/MinijuegoBaldosas.js"></script>
  <!-- FIN BALDOSAS -->

  <!-- AJEDREZ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>
  <script src="js/chess.js" defer></script>
  <!-- FIN AJEDREZ -->

  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <!-- FISICAS (gracias espi)-->
   <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>
       <script
              src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="js/Castillos.js"></script>
  <script src="js/movement.js"></script>
  <!-- RESIZE -->
   <script src="js/resizeManager.js"></script>
   <!-- FIN RESIZE -->
  
  <!-- BALDOSAS HUD-->
  <style>
    /* Animación para simular que el personaje habla/se mueve */
    @keyframes hablar {
      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-10deg);
      }

      75% {
        transform: rotate(10deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }
  </style>
  <!-- FIN BALDOSAS HUD-->

   <!-- RESIZE HUD-->
   <style>
      /* Interfaz de usuario básica */
      .ui-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-family: sans-serif;
      }
      button {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        transition:
          transform 0.1s,
          filter 0.2s;
        color: white;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:active {
        transform: scale(0.95);
      }

      .btn-small {
        background: #e74c3c;
      }
      .btn-normal {
        background: #2ecc71;
        color: #111;
      }
      .btn-giant {
        background: #3498db;
      }
      .btn-custom {
        background: #9b59b6;
      }
    </style>
    <!-- FIN RESIZE HUD-->
  <style>
    #btn-hub {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 999;
      padding: 8px 18px;
      background: rgba(15, 10, 25, .85);
      border: 1px solid rgba(201, 168, 76, .4);
      border-radius: 10px;
      color: #f0e6d3;
      font-family: Georgia, serif;
      font-size: .85rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      letter-spacing: 1px;
      transition: background .3s, border-color .3s, transform .2s
    }

    #btn-hub:hover {
      background: rgba(30, 20, 50, .95);
      border-color: #c9a84c;
      transform: scale(1.05)
    }
  </style>
</head>

<body>
  <button id="btn-hub" onclick="window.location.href='index.html'">← Menú</button>
  <!-- BALDOSAS HUD-->
  <div id="hud-level" style="
      position: fixed; 
      top: 3vh; 
      left: 50%; 
      transform: translateX(-50%);
      z-index: 9999; 
      display: flex; 
      align-items: flex-start;
      width: 90vw;
      max-width: 1200px;
      justify-content: center;
      pointer-events: none;">
    <img id="hud-img" src="../assets/2D/reinaminiatura.png" style="
        width: clamp(120px, 15vw, 300px); 
        height: clamp(120px, 15vw, 300px); 
        object-fit: contain;
        flex-shrink: 0;
        animation: hablar 1s infinite ease-in-out;">

    <div style="
        position: relative;
        margin-left: clamp(10px, 2vw, 20px); 
        margin-top: clamp(10px, 2vw, 20px); 
        background-color: white; 
        color: black; 
        padding: clamp(12px, 1.5vw, 25px) clamp(15px, 2vw, 30px); 
        border-radius: 20px;
        border: clamp(2px, 0.3vw, 4px) solid black;
        font-family: sans-serif; 
        font-size: clamp(16px, 1.8vw, 35px); 
        font-weight: bold;
        max-width: 60vw;
        pointer-events: auto;">
      <span id="row-display">Inicio</span>

      <div style="
          position: absolute;
          left: -10px;
          top: clamp(15px, 2.5vw, 30px);
          width: 0; 
          height: 0; 
          border-top: 10px solid transparent;
          border-bottom: 10px solid transparent; 
          border-right: 10px solid white;">
      </div>
    </div>
  </div>
  <!-- FIN BALDOSAS HUD-->

  <!-- RESIZE HUD -->
    <div class="ui-container">
      <button
        class="btn-small"
        onclick="window.resizeManager.setPlayerSize('small')"
      >
        Modo Ratón
      </button>
      <button
        class="btn-normal"
        onclick="window.resizeManager.setPlayerSize('normal')"
      >
        Normal (1x)
      </button>
      <button
        class="btn-giant"
        onclick="window.resizeManager.setPlayerSize('giant')"
      >
        Modo Gigante
      </button>
    </div>
  <!-- FIN RESIZE HUD -->

  <!-- -----------SCENE------------- -->
  <a-scene cursor="rayOrigin: mouse" physics=" debug:true; driver: ammo; gravity: 0 -9.8 0; ammoSubSteps: 10; ammoStepFrequency: 60; debug: false">

     <!-- ASSETS -->
    <a-assets>
    <a-asset-item id="pawn-w" src="../assets/models/Lajara/GLB/PeonBlanco.glb"></a-asset-item>
    <a-asset-item id="pawn-b" src="../assets/models/Lajara/GLB/PeonNegro.glb"></a-asset-item>
    <a-asset-item id="rook-w" src="../assets/models/Lajara/GLB/TorreBlanco.glb"></a-asset-item>
    <a-asset-item id="rook-b" src="../assets/models/Lajara/GLB/TorreNegro.glb"></a-asset-item>
    <a-asset-item id="knight-w" src="../assets/models/Lajara/GLB/CaballoBlanco.glb"></a-asset-item>
    <a-asset-item id="knight-b" src="../assets/models/Lajara/GLB/CaballoNegro.glb"></a-asset-item>
    <a-asset-item id="bishop-w" src="../assets/models/Lajara/GLB/AlfilBlanco.glb"></a-asset-item>
    <a-asset-item id="bishop-b" src="../assets/models/Lajara/GLB/AlfilNegro.glb"></a-asset-item>
    <a-asset-item id="queen-w" src="../assets/models/Lajara/GLB/ReinaBlanco.glb"></a-asset-item>
    <a-asset-item id="queen-b" src="../assets/models/Lajara/GLB/ReinaNegro.glb"></a-asset-item>
    <a-asset-item id="king-w" src="../assets/models/Lajara/GLB/ReyBlanco.glb"></a-asset-item>
    <a-asset-item id="king-b" src="../assets/models/Lajara/GLB/ReyNegro.glb"></a-asset-item>
    <a-asset-item id="board-model" src="../assets/models/Lajara/GLB/Tablero.glb"></a-asset-item>
    <a-asset-item id="castillo" src="../assets/models/Lajara/GLB/CastilloAlicia4-2.glb"></a-asset-item>
    <a-asset-item id="puerta" src="../assets/models/Lajara/GLB/PuertaAlicia.glb"></a-asset-item>
    <a-asset-item id="reina" src="../assets/models/Lajara/GLB/Reina.glb"></a-asset-item>
    <a-asset-item id="llave" src="../assets/models/Lajara/GLB/Llave.glb"></a-asset-item>

    </a-assets>
    <!-- ASSETS -->

    <!--<a-entity id="player-rig" position="0 11 50">
      
    </a-entity>-->

    
   <a-entity position="0 20 0">
                     <a-cylinder id="player" radius="0.3" height="1.6" rotation="0 180 0" position="0 15 20"
                            ammo-body="type: dynamic; mass: 2; linearDamping: 0.9; angularFactor: 0 0 0;"
                            ammo-shape="type: cylinder" visible="true" player-move door-detector>

                            <a-camera id="cam" position="0 0.6 0" wasd-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: [data-raycastable]; interval: 100" ></a-camera>

                     </a-cylinder>
              </a-entity>

    <!-- ENVIROMENT -->
    <a-entity environment="
      preset: moon;
      fog: 0.8;
      ground: none;
      stageSize: 1000;
      playArea: 200;
      dressing:none;
      lighting: distant;
      lightPosition: 0 -100 -200;
      grid: none;">
    </a-entity>
    <a-entity light=" color: #FAF1A6; intensity: .7" position="0 20 10"></a-entity>
    <a-entity light="color: #FAF1A6; intensity: .7" position="0 20 -10"></a-entity>
    <a-entity light="color: #FAF1A6; intensity: .7" position="10 20 0"></a-entity>
    <a-entity light="color: #FAF1A6; intensity: .7" position="-10 20 0"></a-entity>
    <!-- ENVIROMENT -->

</a-entity>

    <!-- AJEDREZ OBJETOS -->
    <!-- Tablero -->
    <!-- <a-entity position="0 12.5 4"></a-entity>-->
    <a-entity id="board" gltf-model="#board-model" position="-25 11.8 21" rotation="0 0 0" raycaster="objects: none"
      scale=".5 .5 .5">
    </a-entity>
    <!-- Tablero -->

    <!-- Piezas -->
    <a-entity id="pieces" position="-25 11.6 21" scale="0.5 0.5 0.5"></a-entity>
    <!-- Piezas -->

    <!-- FIN AJEDREZ OBJETOS -->
    <!-- Castillo-->
    <a-entity id="Castillo" gltf-model="#castillo" position="1 11.5 1" rotation="0 90 0" raycaster="objects: none"
      scale="1 1 1" colision-ammo></a-entity>
    <!--<a-entity id="Puerta" gltf-model="#puerta" position="1 11.5 0" rotation="0 90 0" raycaster="objects: none"
      scale="1 1 1">-->
    </a-entity>
    <a-entity id="Reina" gltf-model="#reina" position="1 14 -135" rotation="0 0 0" raycaster="objects: none"
      animation-mixer="clip: Idle; loop: repeat; timeScale: 2" scale="3 3 3">
    </a-entity>
    <a-entity id="Llave" gltf-model="#llave" position="-25 15 21" rotation="0 90 0" raycaster="objects: none"
      scale="1 1 1" ammo-body="type: dynamic" ammo-shape="type: box">
    </a-entity>

    <!-- Castillo-->
    <!-- Baldosas-->

    <a-box class="suelo" position="0 11.5 -2.5" width="57.5" height="1" depth="75" color="#555" visible="false"
       ammo-body="type: kinematic" ammo-shape="type: box"></a-box>
    <a-box class="suelo-final" position="0 11.5 -149.5" width="57.5" height="1" depth="50" color="#555" visible="false"
      ammo-body="type: kinematic" ammo-shape="type: box"></a-box>

    <a-entity id="grid-container" position="0 12 -43" scale="1 1 1"></a-entity>

    <a-sky color="#ECECEC"></a-sky>
    <!-- Baldosas-->
  </a-scene>
  <!-- -----------SCENE------------- -->
   <script>
    const mesa = document.querySelector('#Castillo');

mesa.addEventListener('model-loaded', () => {
    mesa.setAttribute('ammo-body', 'type: static');
    mesa.setAttribute('ammo-shape', 'type: mesh');
}); 
  </script>
</body>

</html>
