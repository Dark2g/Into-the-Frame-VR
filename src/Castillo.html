<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ejemplo A-Frame - Camino de Símbolos</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- BALDOSAS -->
    <script src="js/MinijuegoBaldosas.js"></script>
    <!-- FIN BALDOSAS -->

    <!-- AJEDREZ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>
    <script src="js/chess.js" defer></script>
    <!-- FIN AJEDREZ -->

    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <!-- FISICAS (gracias espi)-->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>

    <script src="js/resizeManager.js"></script>
    <!-- FIN RESIZE -->
    <script src="js/startAudioOnClick.js"></script>

    <!-- BALDOSAS HUD-->
    <style>
      /* Animación para simular que el personaje habla/se mueve */
      @keyframes hablar {
        0% {
          transform: rotate(0deg);
        }

        25% {
          transform: rotate(-10deg);
        }

        75% {
          transform: rotate(10deg);
        }

        100% {
          transform: rotate(0deg);
        }
      }
    </style>
    <!-- FIN BALDOSAS HUD-->

    <!-- RESIZE HUD-->
    <style>
      /* Interfaz de usuario básica */
      .ui-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-family: sans-serif;
      }
      button {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        transition:
          transform 0.1s,
          filter 0.2s;
        color: white;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:active {
        transform: scale(0.95);
      }

      .btn-enano {
        background: #2ecc71;
        color: #111;
      }
      .btn-normal {
        background: #60abdd;
      }
      .btn-custom {
        background: #9b59b6;
      }
    </style>
    <!-- FIN RESIZE HUD-->
    <style>
      #btn-hub {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 999;
        padding: 8px 18px;
        background: rgba(15, 10, 25, 0.85);
        border: 1px solid rgba(201, 168, 76, 0.4);
        border-radius: 10px;
        color: #f0e6d3;
        font-family: Georgia, serif;
        font-size: 0.85rem;
        cursor: pointer;
        backdrop-filter: blur(6px);
        letter-spacing: 1px;
        transition:
          background 0.3s,
          border-color 0.3s,
          transform 0.2s;
      }

      #btn-hub:hover {
        background: rgba(30, 20, 50, 0.95);
        border-color: #c9a84c;
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <div
      id="coords-display"
      style="
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 999;
        background: rgba(15, 10, 25, 0.85);
        border: 1px solid rgba(201, 168, 76, 0.4);
        border-radius: 10px;
        color: #f0e6d3;
        font-family: monospace;
        font-size: 0.9rem;
        padding: 8px 12px;
        pointer-events: none;
      "
    >
      X: 0, Y: 0, Z: 0
    </div>
    <div
      id="key-icon-hud"
      style="
        position: fixed;
        top: 60px;
        right: 14px;
        z-index: 999;
        width: 70px;
        height: 70px;
        background: rgba(15, 10, 25, 0.85);
        border: 1px solid rgba(201, 168, 76, 0.4);
        border-radius: 10px;
        display: none;
        pointer-events: none;
        /* Estilos para centrar el emoji */
        text-align: center;
        font-size: 50px;
        line-height: 70px;
      "
    >
      <div
        style="
          font-size: 28px;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
        "
      >
        🔑
      </div>
    </div>
    <button id="btn-hub" onclick="window.location.href = 'index.html'">
      ← Menú
    </button>
    <!-- BALDOSAS HUD-->
    <div
      id="hud-level"
      style="
        position: fixed;
        top: 3vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        align-items: flex-start;
        width: 90vw;
        max-width: 1200px;
        justify-content: center;
        pointer-events: none;
        display: none;
      "
    >
      <img
        id="hud-img"
        src="../assets/2D/reinaminiatura.png"
        style="
          width: clamp(120px, 15vw, 300px);
          height: clamp(120px, 15vw, 300px);
          object-fit: contain;
          flex-shrink: 0;
          animation: hablar 1s infinite ease-in-out;
        "
      />

      <div
        style="
          position: relative;
          margin-left: clamp(10px, 2vw, 20px);
          margin-top: clamp(10px, 2vw, 20px);
          background-color: white;
          color: black;
          padding: clamp(12px, 1.5vw, 25px) clamp(15px, 2vw, 30px);
          border-radius: 20px;
          border: clamp(2px, 0.3vw, 4px) solid black;
          font-family: sans-serif;
          font-size: clamp(16px, 1.8vw, 35px);
          font-weight: bold;
          max-width: 60vw;
          pointer-events: auto;
        "
      >
        <span id="row-display">Inicio</span>

        <div
          style="
            position: absolute;
            left: -10px;
            top: clamp(15px, 2.5vw, 30px);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 10px solid white;
          "
        ></div>
      </div>
    </div>
    <!-- FIN BALDOSAS HUD-->

    <!-- RESIZE HUD -->
    <div class="ui-container">
      <button class="btn-enano" onclick="setPlayerState('enano')">
        Modo enano
      </button>
      <button class="btn-normal" onclick="setPlayerState('normal')">
        Modo normal
      </button>
    </div>
    <!-- FIN RESIZE HUD -->

    <!-- -----------SCENE------------- -->

      vr-mode-ui="enabled: true"
    >

        ></a-asset-item>
        <a-asset-item

        ></a-asset-item>

        ></a-asset-item>
        <a-asset-item

        ></a-asset-item>
        <a-asset-item

          src="../assets/models/Lajara/GLB/ReyNegro.glb"
        ></a-asset-item>
        <a-asset-item

        ></a-asset-item>
        <a-asset-item

        <a-asset-item

        <a-asset-item

        ></a-asset-item>
        <a-asset-item
          id="llave"
          src="../assets/models/Lajara/GLB/Llave.glb"
        ></a-asset-item>
        <audio

          src="../assets/sounds/Llave.wav"
          preload="auto"
        ></audio>

          src="../assets/sounds/Reina.wav"
          preload="auto"

        <audio

          preload="auto"

      </a-assets>
      <!-- ASSETS -->
      <a-entity id="player-rig" position="1 0 20" scale="5 5 5">
        <a-cylinder
          id="player"
          radius="0.3"
          height="1.6"
          rotation="0 0 0"
          position="0 12.8 0"
          ammo-body="type: dynamic; mass: 2; linearDamping: 0.9; angularFactor: 0 0 0"
          ammo-shape="type: cylinder"
          visible="true"
          player-move
          door-detector
          respawn-on-fall="mainRespawn: 1 16 20; tilesRespawn: 1 16 -38"
          coords-tracker
          baldosa-sensor
        >
          <a-camera
            id="cam"
            position="0 0.6 0"
            wasd-controls="enabled: false"
            cursor="rayOrigin: mouse"
            raycaster="objects: [data-raycastable]; interval: 100"
          >
            <a-cursor fuse="true" fuse-timeout="1500" color="#FFD700"
                      geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                      material="shader: flat; opacity: 0.8"></a-cursor>
          </a-camera>
        </a-cylinder>
      </a-entity>
      <!-- VR controllers (fuera del cuerpo de física) -->
      <a-entity laser-controls="hand: left" vr-thumbstick raycaster="objects: .door-trigger, .clickable, [data-raycastable]"></a-entity>
      <a-entity laser-controls="hand: right" vr-thumbstick raycaster="objects: .door-trigger, .clickable, [data-raycastable]"></a-entity>

        scale="1.2 1.2 1.2"
      ></a-entity>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
    <!-- -----------SCENE------------- -->
    <script>
      window.playerHasKey = false;
      /**
       * Componente: respawn-on-fall
       * Comprueba si la entidad cae por debajo de un umbral 'y' en coordenadas mundiales
       * y la teletransporta de vuelta a una posición de respawn.
       */
      AFRAME.registerComponent("respawn-on-fall", {
        schema: {
          threshold: { type: "number", default: -5 },
          // Punto de respawn principal (coordenadas MUNDIALES)
          mainRespawn: { type: "vec3", default: { x: 1, y: 16, z: 20 } },
          // Punto de respawn para el puzzle de baldosas (coordenadas MUNDIALES)
          tilesRespawn: { type: "vec3", default: { x: 1, y: 16, z: -38 } },
          // Límite en Z para decidir qué respawn usar
          tilesZBoundary: { type: "number", default: -40 },
        },
        init: function () {
          this.worldPosition = new THREE.Vector3();
          this.isFalling = false; // Flag para evitar ejecuciones múltiples por caída.
        },
        tick: function () {
          this.el.object3D.getWorldPosition(this.worldPosition);

          // Si el jugador está por encima del umbral, nos aseguramos de que el flag de caída esté reseteado.
          if (this.worldPosition.y > this.data.threshold) {
            this.isFalling = false;
            return;
          }

          // Si estamos por debajo del umbral y el respawn no se ha activado ya para esta caída...
          if (this.isFalling === false) {
            this.isFalling = true; // Activamos el flag para que solo se ejecute una vez.
            console.log("¡Caída detectada! Iniciando respawn...");

            const body = this.el.body;
            if (body) {
              // Detenemos por completo al jugador
              body.setLinearVelocity(new Ammo.btVector3(0, 0, 0));
              body.setAngularVelocity(new Ammo.btVector3(0, 0, 0));

              let respawnTarget;
              if (this.worldPosition.z < this.data.tilesZBoundary) {
                console.log(
                  "Caída en zona de baldosas. Reapareciendo al inicio del puzle.",
                );
                respawnTarget = this.data.tilesRespawn;
              } else {
                console.log(
                  "Caída fuera de la zona de baldosas. Reapareciendo al inicio del nivel.",
                );
                respawnTarget = this.data.mainRespawn;
              }

              // Teletransportamos el cuerpo de físicas a la posición de respawn
              const transform = body.getWorldTransform();
              transform.setOrigin(
                new Ammo.btVector3(
                  respawnTarget.x,
                  respawnTarget.y,
                  respawnTarget.z,
                ),
              );
              body.setWorldTransform(transform);
              body.activate(); // Forzamos a que el cuerpo se "despierte" para que las físicas se apliquen inmediatamente.
            }
          }
        },
      });

      /**
       * Componente: coords-tracker
       * Muestra las coordenadas mundiales de la entidad en un elemento del HUD.
       */
      AFRAME.registerComponent("coords-tracker", {
        init: function () {
          this.displayEl = document.getElementById("coords-display");
          if (!this.displayEl) {
            console.error('Element with ID "coords-display" not found.');
            return;
          }
          // Reutilizamos un vector para no crear uno nuevo en cada frame (optimización)
          this.worldPosition = new THREE.Vector3();
        },
        tick: function () {
          if (!this.displayEl) return;

          this.el.object3D.getWorldPosition(this.worldPosition);

          const x = this.worldPosition.x.toFixed(1);
          const y = this.worldPosition.y.toFixed(1);
          const z = this.worldPosition.z.toFixed(1);

          this.displayEl.innerText = `X: ${x}, Y: ${y}, Z: ${z}`;
        },
      });

      /**
       * Componente: door-rotator
       * Rota partes específicas de un modelo GLTF (las puertas).
       * Se anima usando el componente de animación de A-Frame.
       */
      AFRAME.registerComponent("door-rotator", {
        schema: {
          door1_ry: { type: "number", default: 0 },
          door2_ry: { type: "number", default: 0 },
        },
        init: function () {
          this.door1 = null;
          this.door2 = null;
          const model = this.el.getObject3D("mesh");
          if (model) {
            this.findDoors(model);
          } else {
            this.el.addEventListener("model-loaded", (e) => {
              this.findDoors(e.detail.model);
            });
          }
        },
        findDoors: function (model) {
          model.traverse((node) => {
            if (node.name === "PuertaFrontal") this.door1 = node;
            if (node.name === "PuertaFrontal.001") this.door2 = node;
          });
          if (this.door1 && this.door2) {
            console.log("Puertas del castillo encontradas para animar.");
            // Añade esto para que aplique los datos iniciales o actuales de la animación nada más cargar
            this.update();
          }
        },
        update: function () {
          if (this.door1)
            this.door1.rotation.y = THREE.MathUtils.degToRad(
              this.data.door1_ry,
            );
          if (this.door2)
            this.door2.rotation.y = THREE.MathUtils.degToRad(
              this.data.door2_ry,
            );
        },
      });

      /**
       * Componente: key-pickup
       * Gestiona la recogida de una llave y la apertura de una puerta.
       */
      AFRAME.registerComponent("key-pickup", {
        init: function () {
          const keyEl = this.el;
          const keyIconHud = document.getElementById("key-icon-hud");

          // Espera a que el modelo se cargue para añadirle el cuerpo físico.
          // Esto evita que el cuerpo se cree con tamaño 0 antes de que el modelo exista,
          // que es la razón por la que la llave atravesaba el suelo.
          keyEl.addEventListener("model-loaded", () => {
            // Usamos un timeout para asegurar que el modelo se ha renderizado una vez
            setTimeout(() => {
              keyEl.setAttribute("ammo-body", { type: "dynamic", mass: 1 });
              keyEl.setAttribute("ammo-shape", { type: "box" });
              console.log("Cuerpo físico de la llave creado correctamente.");
            }, 100);
          });
          keyEl.setAttribute("sound", {
            src: "#llave-snd",
            autoplay: false,
            positional: false,
            volume: 1,
          });
          // Evento al hacer clic en la llave (se ejecuta solo una vez)
          keyEl.addEventListener(
            "click",
            () => {
              console.log("¡Llave recogida!");
              keyEl.components.sound.playSound();
              window.playerHasKey = true;

              // 1. Mostrar icono de la llave en el HUD
              if (keyIconHud) {
                keyIconHud.style.display = "block";
              }

              // 2. Hacer que la llave desaparezca (visual y físicamente)
              keyEl.setAttribute("visible", false);
              keyEl.removeAttribute("ammo-body");
              keyEl.removeAttribute("data-raycastable");
            },
            { once: true },
          );
        },
      });

      /**
       * Componente: locked-door
       * Gestiona la apertura de una puerta si el jugador tiene la llave.
       */
      AFRAME.registerComponent("locked-door", {
        init: function () {
          const doorCollisionEl = this.el;

          doorCollisionEl.addEventListener("click", () => {
            if (window.playerHasKey) {
              console.log("Usando la llave para abrir la puerta.");

              // 1. Animar la apertura de la puerta del modelo GLTF
              const gltfDoorEl = document.querySelector("#Puerta");
              if (gltfDoorEl) {
                gltfDoorEl.emit("open-doors");
              }

              // 2. Quitar la colisión de la puerta
              doorCollisionEl.removeAttribute("ammo-body");
              doorCollisionEl.setAttribute("visible", false);
              doorCollisionEl.removeAttribute("data-raycastable");

              // 3. Ocultar el icono de la llave del HUD
              const keyIconHud = document.getElementById("key-icon-hud");
              if (keyIconHud) {
                keyIconHud.style.display = "none";
              }

              // 4. Mostrar a la Reina y su diálogo
              const reinaEl = document.querySelector("#Reina");
              const reinaHudEl = document.getElementById("hud-level");
              if (reinaEl) reinaEl.setAttribute("visible", true);
              if (reinaHudEl) reinaHudEl.style.display = "flex";

              window.playerHasKey = false; // La llave ya se ha usado
            } else {
              console.log("La puerta está cerrada. Se necesita una llave.");
            }
          });
        },
      });

      /**
       * Sistema de cambio de tamaño personalizado para la escena del Castillo.
       */
      const playerStates = {
        enano: {
          rigScale: 1,
          playerHeight: 0.2, // ¡Cuerpo de 20 centímetros!
          playerPositionY: 12.1, // Te apoyamos perfectamente en el suelo (12.0)
          cameraY: -0.05, // Tus ojos rozando las baldosas, tal y como querías
        },
        normal: {
          // Modo "gigante"
          rigScale: 5,
          playerHeight: 1.6,
          playerPositionY: 12.8,
          cameraY: 0.6,
        },
      };

      function setPlayerState(stateName) {
        const state = playerStates[stateName];
        if (!state) return;

        const rig = document.querySelector("#player-rig");
        const player = document.querySelector("#player");
        const cam = document.querySelector("#cam");
        const duration = 1000;
        const easing = "easeInOutQuad";

        console.log(`Cambiando a estado: ${stateName}`);

        // 1. Animamos la escala, la altura, la posición y la cámara
        rig.setAttribute(
          "animation__scale",
          `property: scale; to: ${state.rigScale} ${state.rigScale} ${state.rigScale}; dur: ${duration}; easing: ${easing};`,
        );
        player.setAttribute(
          "animation__height",
          `property: height; to: ${state.playerHeight}; dur: ${duration}; easing: ${easing};`,
        );
        player.setAttribute(
          "animation__pos",
          `property: position; to: 0 ${state.playerPositionY} 0; dur: ${duration}; easing: ${easing};`,
        );
        cam.setAttribute(
          "animation__camerapos",
          `property: position; to: 0 ${state.cameraY} 0; dur: ${duration}; easing: ${easing};`,
        );

        // 2. ¡EL TRUCO DE LAS FÍSICAS!
        // Esperamos a que termine la animación (1000ms) y le decimos a Ammo.js que
        // vuelva a calcular nuestro tamaño invisible para poder colarnos por los agujeros.
        setTimeout(() => {
          // Quitamos la forma física un milisegundo...
          player.removeAttribute("ammo-shape");
          // ...y se la volvemos a poner para que pille el tamaño de 20cm
          player.setAttribute("ammo-shape", "type: cylinder");
          console.log("Cuerpo físico de colisión actualizado al nuevo tamaño.");
        }, duration + 80);
      }
    </script>
  </body>
</html>
