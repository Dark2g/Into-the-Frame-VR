<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Prueba jugador con f�sicas</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.1/dist/aframe-physics-system.min.js"></script>
    <script src="js/movement.js"></script>

</head>
<body>
    <a-scene physics="driver: ammo; gravity: 0 -9.8 0; ammoSubSteps: 10; ammoStepFrequency: 60; debug: true">



        <!-- Jugador -->
        <a-entity>
            <a-cylinder id="player" radius="0.3" height="20" position="0 1 0"
                        ammo-body="type: dynamic; mass: 1; linearDamping: 0.9; angularFactor: 0 0 0"
                        ammo-shape="type: box; radius: 0.3; height: 1.4"
                        player-move><a-entity id="cam" camera look-controls="pointerLockEnabled: true" position="0 0.8 0"></a-entity></a-cylinder>


        </a-entity>

        <a-entity id="miModelo" gltf-model="url(../assets/models/Gabi/laberinto.glb)" position="0 0 0"></a-entity>
        <a-entity id="mesa" gltf-model="url(../assets/models/Gabi/Mesa.glb)" position="0 0 0"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 0"></a-entity>
        <a-entity id="pipa" gltf-model="url(../assets/models/Gabi/Pipa.glb)" position="0 0 0"></a-entity>
        <a-entity id="tarta" gltf-model="url(../assets/models/Gabi/Tarta.glb)" position="0 0 0"></a-entity>
        <a-entity id="vela" gltf-model="url(../assets/models/Gabi/Vela.glb)" position="0 0 0"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 0"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 0"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 0"></a-entity>

        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 6"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 -2"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 12"></a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 -10"></a-entity>


        <script>
            const model = document.querySelector('#miModelo');
            model.addEventListener('model-loaded', () => {
                model.setAttribute('ammo-body', 'type: static');
                model.setAttribute('ammo-shape', 'type: mesh');
            });
        </script>





        <a-sky color="#ECECEC"></a-sky>
    </a-scene>
</body>
</html>
