<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Laberinto</title>


    <!-- Revisar que estén los archivos -->
    <link rel="stylesheet" href="css/dialog.css" />
    <script src="js/dialog.js"></script>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.1/dist/aframe-physics-system.min.js"></script>
    <script src="js/movement.js"></script>

  <style>
    #btn-hub{position:fixed;top:14px;left:14px;z-index:999;padding:8px 18px;background:rgba(15,10,25,.85);border:1px solid rgba(201,168,76,.4);border-radius:10px;color:#f0e6d3;font-family:Georgia,serif;font-size:.85rem;cursor:pointer;backdrop-filter:blur(6px);letter-spacing:1px;transition:background .3s,border-color .3s,transform .2s}#btn-hub:hover{background:rgba(30,20,50,.95);border-color:#c9a84c;transform:scale(1.05)}
  </style>
</head>
<body>
    <button id="btn-hub" onclick="window.location.href='index.html'">← Menú</button>

    <a-scene cursor="rayOrigin: mouse" physics="driver: ammo; gravity: 0 -9.8 0; ammoSubSteps: 10; ammoStepFrequency: 60; debug: true">




        <!-- Jugador -->
        <a-entity>
            <a-cylinder id="player" radius="0.3" height="2" position="0 1 0"
                        ammo-body="type: dynamic; mass: 1; linearDamping: 0.9; angularFactor: 0 0 0"
                        ammo-shape="type: box; radius: 0.3; height: 1.4"
                        player-move>
                <a-entity id="cam" camera look-controls="pointerLockEnabled: false" position="0 0.8 0">

                    <a-entity id="holder" position="0 -0.3 -1"></a-entity>
                </a-entity>

            </a-cylinder>


        </a-entity>
        <a-box color="brown"
               position="-8 0.5 -3"
               animal-interactive="tipo: Conejo; slotIndex: 0; texto: Habrá aperitivo aunque sea ¿no?"></a-box>
        <a-box color="brown"
               position="-8 0.5 -3"
               animal-interactive="tipo: Buho; slotIndex: 1; texto: Quiero conocer mucha gente nueva."></a-box>
        <a-box color="brown"
               position="-8 0.5 -3"
               animal-interactive="tipo: Perro; slotIndex: 2; texto: ¿Tenéis algo con lo que pueda tomarme estas plantas “medicinales”? "></a-box>
        <a-box color="brown"
               position="-8 0.5 -3"
               animal-interactive="tipo: Gato; slotIndex: 3; texto: Quiero estar junto a un compañero de oficio."></a-box>
        <a-box color="brown"
               position="-8 0.5 -3"
               animal-interactive="tipo: Cerdo; slotIndex: 4; texto: Quiero poder leer aún si se alarga mucho la velada"></a-box>
        <a-box color="brown"
               position="-8 0.5 -3"
               animal-interactive="tipo: Gallina; slotIndex: 5; texto: Soy un poco introvertida"></a-box>

        <a-entity id="miModelo" gltf-model="url(../assets/models/Gabi/laberinto.glb)" position="0 0 0"></a-entity>
        <a-entity id="mesa" gltf-model="url(../assets/models/Gabi/Mesa.glb)" position="0 0 0"></a-entity>

        <a-entity id="pipa" gltf-model="url(../assets/models/Gabi/Pipa.glb)" position="-3 0 -11"></a-entity>
        <a-entity id="tarta" gltf-model="url(../assets/models/Gabi/Tarta.glb)" position="3 0 0"></a-entity>
        <a-entity id="vela" gltf-model="url(../assets/models/Gabi/Vela.glb)" position="3 0 20"></a-entity>


        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 0" class="asiento" asiento="tipo: Buho">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>

        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 -12" class="asiento" asiento="tipo: null">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 -6" class="asiento" asiento="tipo: Conejo">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" position="0 0 6" class="asiento" asiento="tipo: Cerdo">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>

        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 5" class="asiento" asiento="tipo: null">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 -2" class="asiento" asiento="tipo: Gato">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 11" class="asiento" asiento="tipo: Gallina">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>
        <a-entity id="silla" gltf-model="url(../assets/models/Gabi/Silla.glb)" rotation="0 180 0" position="0 0 -8" class="asiento" asiento="tipo: Perro">
            <a-entity class="seat-point" position="7.2 3 2.2"></a-entity>
        </a-entity>



        <script>
            const model = document.querySelector('#miModelo');
            model.addEventListener('model-loaded', () => {
                model.setAttribute('ammo-body', 'type: static');
                model.setAttribute('ammo-shape', 'type: mesh');
            });

            // Slots globales en el centro para evitar superposición
            const centroSlots = [
                new THREE.Vector3(10, 0.5, -16),
                new THREE.Vector3(8, 0.5, -16),
                new THREE.Vector3(12, 0.5, -16),
                new THREE.Vector3(14, 0.5, -16),
                new THREE.Vector3(16, 0.5, -16),
                new THREE.Vector3(18, 0.5, -16),
            ];

            // Componente unificado para animales
            AFRAME.registerComponent("animal-interactive", {
                schema: {
                    tipo: { type: "string" },
                    slotIndex: { type: "int", default: 0 },
                    texto: { type: "string", default: "" },
                },
                init: function () {
                    this.state = "idle"; // idle -> at-center -> holdable
                    this.originalScale = this.el.getAttribute("scale");
                    this.centerPos = null;

                    this.el.addEventListener("click", () => {
                        const centro = document.querySelector("#centro");

                        if (this.state === "idle") {
                            // Teletransporta al slot del centro
                            const slot = centroSlots[this.data.slotIndex];
                            this.el.object3D.position.copy(slot);
                            this.centerPos = slot.clone();
                            this.state = "at-center";
                            console.log(`${this.data.tipo} teletransportado al centro`);
                        } else if (
                            this.state === "at-center" &&
                            window.animalActivo == null
                        ) {
                            const animalEl = this.el;
                            const animalTipo = this.data.tipo;
                            const animalText = this.data.texto;
                            showDialogTakeAnimal(
                                animalTipo,
                                animalText,
                                () => {
                                    window.animalActivo = animalEl;
                                    this.state = "holdable";
                                    console.log(`${animalTipo} ahora holdable`);
                                },
                                animalText
                                ,
                                () => {
                                    console.log(`${animalTipo} se queda en el centro`);
                                },
                            );
                        }
                    });
                },
                tick: function () {
                    if (this.state === "holdable" && window.animalActivo === this.el) {
                        const cam = document.querySelector("#cam").object3D;
                        const offset = new THREE.Vector3(0, -0.3, -3); // frente y un poco abajo
                        offset.applyQuaternion(cam.quaternion);
                        const camPos = cam.getWorldPosition(new THREE.Vector3());
                        this.el.object3D.position.copy(camPos.clone().add(offset));
                        this.el.object3D.quaternion.copy(cam.quaternion);
                    }
                },
                resetToCenter: function () {
                    if (this.centerPos) {
                        this.el.object3D.position.copy(this.centerPos);
                        this.el.setAttribute("scale", this.originalScale);
                        this.state = "at-center";
                        this.el.removeAttribute("placed");
                        delete this.el.assignedAsiento;
                        console.log(`${this.data.tipo} reseteado al centro`);
                    }
                },
            });

            // Componente para asientos y los animales sentandose
            AFRAME.registerComponent("asiento", {
                schema: { tipo: { type: "string" } }
                , init: function () {
                    this.el.addEventListener("click", () => {
                        if (!window.animalActivo) return;

                        const animal = window.animalActivo;
                        const tipoAnimal = animal.getAttribute("animal-interactive").tipo;

                        const seatPoint = this.el.querySelector(".seat-point");

                        if (!seatPoint) {
                            console.warn("Asiento sin seat-point");
                            return;
                        }

                        const worldPos = seatPoint.object3D.getWorldPosition(new THREE.Vector3());
                        const worldRot = seatPoint.object3D.getWorldQuaternion(new THREE.Quaternion());

                        animal.object3D.position.copy(worldPos);
                        animal.object3D.quaternion.copy(worldRot);



                        animal.setAttribute("placed", "true");
                        animal.assignedAsiento = this;
                        window.animalActivo = null;

                        console.log(
                            `${tipoAnimal} colocado en asiento ${this.data.tipo}`,
                        );

                        // Comprobar todos los animales
                        checkAllAnimals();
                    });
                },
            });

            // Función global para validar si los animales están correctos
            function checkAllAnimals() {
                const animales = document.querySelectorAll("[animal-interactive]");

                // Solo validar si todos están colocados
                const todosColocados = Array.from(animales).every(
                    (a) => a.getAttribute("placed") === "true",
                );
                if (!todosColocados) return;

                let todosCorrectos = true;
                animales.forEach((a) => {
                    const tipoAnimal = a.getAttribute("animal-interactive").tipo;
                    const asiento = a.assignedAsiento;
                    // ACTUALIZAR comprobar que solo se puede sentar un animal en cada asiento
                    if (!asiento || asiento.data.tipo !== tipoAnimal) {
                        todosCorrectos = false;
                    }
                });

                if (todosCorrectos) {
                    console.log("✔ Todos correctos. Nada que hacer.");
                } else {
                    console.log("✖ Al menos uno está mal, reseteando todos");
                    animales.forEach((a) => {
                        a.components["animal-interactive"].resetToCenter();
                    });
                }
            }

            function showDialogTakeAnimal(animalTipo, animalText, onTake, onLeave) {
                // Desactivar movimiento al abrir
                //setPlayerMovement(false);

                window.dialogManager.show({
                    title: animalTipo,
                    content: `¿Quieres coger el ${animalTipo}?<br>${animalText}`,
                    showCloseButton: true,
                    gameStyle: true,
                    darkBackground: true, // Corregido typo
                    onClose: () => {
                        // Reactivar movimiento al cerrar (por X o fondo)
                        //setPlayerMovement(true);
                    },
                    buttons: [
                        {
                            text: "Coger",
                            callback: () => {
                                if (onTake) onTake();
                                //setPlayerMovement(true);
                            },
                        },
                        {
                            text: "No coger",
                            secondary: true,
                            callback: () => {
                                if (onLeave) window.dialogManager.hide(() => onLeave());
                                //setPlayerMovement(true);
                            },
                        },
                    ],
                });
            }


        </script>





        <a-sky color="#ECECEC"></a-sky>
    </a-scene>
</body>
</html>
