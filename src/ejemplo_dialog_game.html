<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Diálogos Estilo Videojuego - A-Frame</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Sistema de diálogos -->
    <script src="js/dialog.js"></script>
    <link rel="stylesheet" href="css/dialog.css" />

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* Botones de demostración */
      .demo-controls {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        display: flex;
        gap: 10px;
        flex-direction: column;
      }

      .demo-button {
        background-color: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .demo-button:hover {
        background-color: #764ba2;
        transform: translateY(-2px);
      }

      .demo-section {
        margin-bottom: 10px;
        padding: 5px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 5px;
      }

      .demo-label {
        color: white;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 5px;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <!-- Controles de demostración -->
    <div class="demo-controls">
      <div class="demo-section">
        <div class="demo-label">Estilo Normal</div>
        <button class="demo-button" onclick="showNormalDialog()">
          Diálogo Centrado
        </button>
        <button class="demo-button" onclick="showNormalNoBackground()">
          Sin Fondo Oscuro
        </button>
      </div>

      <div class="demo-section">
        <div class="demo-label">Estilo Videojuego</div>
        <button class="demo-button" onclick="showGameDialog()">
          Diálogo RPG Básico
        </button>
        <button class="demo-button" onclick="showGameDialogWithCharacter()">
          Con Personaje
        </button>
        <button class="demo-button" onclick="showGameDialogNoBackground()">
          Sin Fondo Oscuro
        </button>
        <button class="demo-button" onclick="showGameDialogContinue()">
          Con Indicador
        </button>
      </div>

      <div class="demo-section">
        <div class="demo-label">Colores Personalizados</div>
        <button class="demo-button" onclick="showCustomColorRed()">
          Rojo Fuego
        </button>
        <button class="demo-button" onclick="showCustomColorGreen()">
          Verde Esmeralda
        </button>
        <button class="demo-button" onclick="showCustomColorGold()">
          Oro Dorado
        </button>
        <button class="demo-button" onclick="showCustomColorCyan()">
          Cian Tecnológico
        </button>
      </div>
    </div>

    <!-- Escena A-Frame -->
    <a-scene cursor="rayOrigin: mouse">
      <!-- Cámara -->
      <a-entity position="0 1.6 4">
        <a-camera></a-camera>
      </a-entity>

      <!-- Luces -->
      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="directional" position="1 3 2"></a-light>

      <!-- Suelo -->
      <a-plane rotation="-90 0 0" width="10" height="10" color="#8AC">
      </a-plane>

      <!-- NPC 1 - Guerrero -->
      <a-box
        id="npc-warrior"
        position="-2 1 0"
        width="1"
        height="1.5"
        depth="0.5"
        color="#FF6B6B"
      >
      </a-box>
      <a-text
        value="Guerrero"
        position="-2 2 0"
        align="center"
        color="#333"
        width="4"
      ></a-text>

      <!-- NPC 2 - Mago -->
      <a-sphere id="npc-mage" position="0 1.5 0" radius="0.6" color="#4ECDC4">
      </a-sphere>
      <a-text
        value="Mago"
        position="0 2.5 0"
        align="center"
        color="#333"
        width="4"
      ></a-text>

      <!-- NPC 3 - Comerciante -->
      <a-cylinder
        id="npc-merchant"
        position="2 1 0"
        radius="0.5"
        height="1.5"
        color="#95E1D3"
      >
      </a-cylinder>
      <a-text
        value="Comerciante"
        position="2 2 0"
        align="center"
        color="#333"
        width="4"
      ></a-text>

      <!-- Texto informativo -->
      <a-text
        value="Haz clic en los NPCs o usa los botones"
        position="0 3 -1"
        align="center"
        color="#333"
        width="6"
      ></a-text>
    </a-scene>

    <script>
      // ========================================
      // EJEMPLOS DE DIÁLOGOS NORMALES
      // ========================================

      function showNormalDialog() {
        window.dialogManager.show({
          title: "Diálogo Normal",
          content:
            "Este es un diálogo centrado con fondo oscuro (estilo por defecto).",
          buttons: [{ text: "OK" }],
        });
      }

      function showNormalNoBackground() {
        window.dialogManager.show({
          title: "Sin Fondo Oscuro",
          content:
            "Este diálogo no tiene fondo oscuro. Puedes ver la escena detrás.",
          darkBackground: false,
          buttons: [{ text: "Cerrar" }],
        });
      }

      // ========================================
      // EJEMPLOS DE DIÁLOGOS ESTILO VIDEOJUEGO
      // ========================================

      function showGameDialog() {
        window.dialogManager.show({
          gameStyle: true,
          title: "Bienvenido Aventurero",
          content:
            "Este es un diálogo estilo videojuego que aparece en la parte inferior de la pantalla, similar a los RPGs clásicos.",
          buttons: [
            {
              text: "Continuar",
              callback: () => {
                console.log("Diálogo continuado");
              },
            },
          ],
        });
      }

      function showGameDialogWithCharacter() {
        window.dialogManager.show({
          gameStyle: true,
          characterName: "Guardián del Bosque",
          title: "Mensaje Importante",
          content:
            "Saludos, valiente aventurero. He estado esperando tu llegada. Las fuerzas oscuras se acercan...",
          buttons: [
            {
              text: "¿Qué debo hacer?",
              callback: () => {
                window.dialogManager.show({
                  gameStyle: true,
                  characterName: "Guardián del Bosque",
                  content:
                    "Debes encontrar las tres gemas sagradas antes de que caiga la noche.",
                  buttons: [
                    { text: "Acepto la misión" },
                    { text: "Necesito más tiempo", secondary: true },
                  ],
                });
              },
            },
            {
              text: "Adiós",
              secondary: true,
            },
          ],
        });
      }

      function showGameDialogNoBackground() {
        window.dialogManager.show({
          gameStyle: true,
          darkBackground: false,
          characterName: "Narrador",
          title: "Sin Fondo Oscuro",
          content:
            "Este diálogo estilo videojuego no oscurece el fondo. Puedes ver la escena 3D completamente.",
          buttons: [{ text: "Entendido" }],
        });
      }

      function showGameDialogContinue() {
        window.dialogManager.show({
          gameStyle: true,
          characterName: "Sistema",
          content: "Has encontrado un cofre del tesoro. ¿Quieres abrirlo?",
          buttons: [{ text: "Abrir" }, { text: "Dejar", secondary: true }],
        });
      }

      // ========================================
      // EJEMPLOS DE COLORES PERSONALIZADOS (MODO ESTÉTICO)
      // ========================================

      function showCustomColorRed() {
        window.dialogManager.show({
          gameStyle: true,
          characterName: "Dragón de Fuego",
          title: "¡Advertencia!",
          content:
            "Has despertado al guardián. Nota como los botones tienen gradiente y estilo.",
          // MODO ESTÉTICO:
          primaryColor: "#ff4444",
          secondaryColor: "#cc0000",
          textColor: "white",
          buttons: [{ text: "¡Luchar!" }, { text: "Huir", secondary: true }],
        });
      }

      function showCustomColorGreen() {
        window.dialogManager.show({
          gameStyle: true,
          characterName: "Druida del Bosque",
          title: "Bendición Natural",
          content:
            "La naturaleza te protege. El borde superior es verde brillante.",
          primaryColor: "#00cc66",
          secondaryColor: "#006633",
          textColor: "white",
          darkBackground: false,
          buttons: [{ text: "Gracias" }],
        });
      }

      function showCustomColorGold() {
        window.dialogManager.show({
          title: "¡Tesoro Legendario!",
          content:
            "Has encontrado el legendario Cofre Dorado. ¡Míralo brillar!",
          primaryColor: "#ffd700",
          secondaryColor: "#ff8c00",
          textColor: "#333333", // Texto oscuro para contraste con oro
          buttons: [
            { text: "Recoger" },
            { text: "Examinar más", secondary: true },
          ],
        });
      }

      function showCustomColorCyan() {
        window.dialogManager.show({
          gameStyle: true,
          characterName: "IA del Sistema",
          title: "Acceso Concedido",
          content:
            "Sistema en línea. Observa el estilo futurista y los botones neón.",
          primaryColor: "#00ffff",
          secondaryColor: "#0088ff",
          backgroundColor: "#004400",
          textColor: "#e0ffff",
          buttons: [
            { text: "Iniciar" },
            { text: "Configuración", secondary: true },
          ],
        });
      }

      // ========================================
      // INTERACCIONES CON NPCs
      // ========================================

      document.addEventListener("DOMContentLoaded", () => {
        // Guerrero
        const warrior = document.querySelector("#npc-warrior");
        warrior.addEventListener("click", () => {
          window.dialogManager.show({
            gameStyle: true,
            characterName: "Guerrero Valiente",
            title: "¡Saludos!",
            content:
              "¿Buscas entrenamiento en combate? Puedo enseñarte las artes de la espada.",
            darkBackground: true,
            buttons: [
              {
                text: "Entrenar (100 oro)",
                callback: () => {
                  window.dialogManager.show({
                    gameStyle: true,
                    content: "¡Excelente! Tu fuerza ha aumentado +5.",
                    buttons: [{ text: "Gracias" }],
                  });
                },
              },
              {
                text: "Tal vez después",
                secondary: true,
              },
            ],
          });
        });

        // Mago
        const mage = document.querySelector("#npc-mage");
        mage.addEventListener("click", () => {
          window.dialogManager.show({
            gameStyle: true,
            characterName: "Mago Sabio",
            title: "Bienvenido a mi torre",
            content: "Poseo conocimientos arcanos antiguos. ¿Qué deseas saber?",
            darkBackground: false, // Sin fondo para ver la escena
            buttons: [
              {
                text: "Aprender magia",
                callback: () => {
                  window.dialogManager.show({
                    gameStyle: true,
                    characterName: "Mago Sabio",
                    content:
                      "Te enseñaré el hechizo de Bola de Fuego. Requiere 50 de maná.",
                    buttons: [
                      { text: "Aprender" },
                      { text: "Cancelar", secondary: true },
                    ],
                  });
                },
              },
              {
                text: "Comprar pociones",
                callback: () => {
                  window.dialogManager.show({
                    gameStyle: true,
                    content:
                      "Tengo pociones de vida (50 oro) y pociones de maná (30 oro).",
                    buttons: [
                      { text: "Comprar vida" },
                      { text: "Comprar maná" },
                      { text: "Salir", secondary: true },
                    ],
                  });
                },
              },
              {
                text: "Adiós",
                secondary: true,
              },
            ],
          });
        });

        // Comerciante
        const merchant = document.querySelector("#npc-merchant");
        merchant.addEventListener("click", () => {
          window.dialogManager.show({
            gameStyle: true,
            characterName: "Comerciante",
            title: "¡Bienvenido a mi tienda!",
            content: "Tengo los mejores artículos del reino. ¿Qué te interesa?",
            buttons: [
              {
                text: "Ver armas",
                callback: () => {
                  window.dialogManager.show({
                    gameStyle: true,
                    content:
                      "Espada de hierro (200 oro) - Daño +10<br>Espada de acero (500 oro) - Daño +25",
                    buttons: [
                      { text: "Comprar hierro" },
                      { text: "Comprar acero" },
                      { text: "Volver", secondary: true },
                    ],
                  });
                },
              },
              {
                text: "Ver armaduras",
                callback: () => {
                  window.dialogManager.show({
                    gameStyle: true,
                    content:
                      "Armadura de cuero (150 oro) - Defensa +5<br>Armadura de placas (600 oro) - Defensa +20",
                    buttons: [
                      { text: "Comprar cuero" },
                      { text: "Comprar placas" },
                      { text: "Volver", secondary: true },
                    ],
                  });
                },
              },
              {
                text: "Salir",
                secondary: true,
              },
            ],
          });
        });
      });
    </script>
  </body>
</html>
